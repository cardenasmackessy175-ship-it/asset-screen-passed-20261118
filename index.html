const by=new Map(items.map(i=>[i.n,i]));
const copyBtn=(i,extra)=>i.d?`<button class="cp ${extra||''}" data-copy="${esc(i.n)}">复制地址</button>`:'';
function draw(){document.getElementById('n').textContent='共 '+items.length+' 个';
document.getElementById('b').innerHTML=K.map(k=>`<button class="${k==cur?'on':''}" data-k="${k}">${k} ${items.filter(i=>i.k==k).length}</button>`).join(' ');
document.getElementById('g').innerHTML=items.filter(i=>i.k==cur).map(i=>`<div class="c" data-n="${esc(i.n)}"><div class="p"><img loading="lazy" src="img/${esc(i.n)}.webp">${i.v?'<span class="tag">视频</span>':''}${copyBtn(i)}</div><div class="m" title="${esc(i.t)}">${esc(i.n)}　${esc(i.t)}</div></div>`).join('')}
function copy(text,btn){const done=()=>{btn.textContent='已复制';btn.classList.add('ok');setTimeout(()=>{btn.textContent='复制地址';btn.classList.remove('ok')},1400)};
const old=()=>{const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){prompt('复制这个地址',text)}a.remove()};
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done,old);else old()}
function show(i){document.getElementById('vp').innerHTML=(i.v?`<video controls autoplay loop muted playsinline poster="img/${esc(i.n)}.webp" src="vid/${esc(i.n)}.mp4"></video>`:`<img src="img/${esc(i.n)}.webp">`)+copyBtn(i,i.v?'hi':'');
document.getElementById('vm').textContent=i.n+'　'+(i.t||'');document.getElementById('v').classList.add('on')}
function hide(){document.getElementById('v').classList.remove('on');document.getElementById('vp').innerHTML=''}
document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c){e.stopPropagation();const i=by.get(c.dataset.copy);copy(ROOT+i.d,c);return}
const k=e.target.closest('[data-k]');if(k){cur=k.dataset.k;draw();window.scrollTo(0,0);return}
const card=e.target.closest('.c');if(card){show(by.get(card.dataset.n));return}
if(e.target.id=='v'||e.target.id=='x')hide()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')hide()});
draw()</script></html>
